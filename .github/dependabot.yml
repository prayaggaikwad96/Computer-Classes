version: 2

updates:
  - package-ecosystem: "github-actions"
    # GitHub's required path for the Actions ecosystem. Dependabot searches
    # both /.github/workflows and a root action.yml from this directory.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
