version: 2

updates:
  # Track the repository's actual workflow directory. Dependabot's
  # github-actions updater requires at least one workflow/action manifest
  # beneath this directory; this repository currently has codeql.yml only.
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
